name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Cada sistema mira en sitios distintos (registro, launchd, systemd), así que se prueba
    # en los tres: además de los tests, se hace una pasada de verdad con «--json -» para
    # comprobar que no falla y que encuentra cosas (los runners siempre tienen servicios).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Formato (ruff format)
        run: ruff format --check .
      - name: Pruebas (pytest)
        if: runner.os != 'Linux'
        run: pytest -q
      - name: Pruebas (pytest, con una pantalla virtual para la ventana)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          xvfb-run -a pytest -q
      - name: La demo funciona
        run: boot-scout --demo
      - name: Una pasada de verdad en este sistema
        shell: bash
        run: |
          # En el runner tiene que encontrar algo que arranca solo (servicios, agentes…).
          boot-scout --json cosas.json
          python -c "import json; d=json.load(open('cosas.json',encoding='utf-8')); print(d['system'], len(d['entries']), 'entradas'); assert d['entries'], 'no encontró nada'"

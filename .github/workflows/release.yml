name: Instaladores

# Construye el instalador de Windows, la app de macOS y el paquete de Linux, y prueba que
# cada uno se instala y funciona. Con cada cambio en main solo se comprueban. Para
# publicarlos en Releases: subir una etiqueta de versión (git tag v1.1.0 && git push --tags)
# o, desde GitHub, Actions > Instaladores > Run workflow con "Publicar" marcado, que crea
# la etiqueta con la versión de bootscout/__init__.py.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar en Releases (crea la etiqueta v + la versión de __init__.py)
        type: boolean
        default: false

permissions:
  contents: write # para crear la release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: PyInstaller
        run: |
          pip install . pyinstaller pillow
          pyinstaller --noconfirm packaging/boot-scout.spec
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('packaging/icon.png').save('packaging/icon.ico', sizes=[(s, s) for s in (16, 24, 32, 48, 64, 128, 256)])"
          $env:BOOTSCOUT_VERSION = python -c "import bootscout; print(bootscout.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging\windows\boot-scout.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha fallado" }
      - name: Instalarlo y probarlo
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\boot-scout-instalado"
          $setup = Start-Process dist\boot-scout-windows.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=$dir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "El instalador ha fallado ($($setup.ExitCode))" }
          $check = Start-Process "$dir\boot-scout.exe" -ArgumentList "--comprobar" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "boot-scout --comprobar ha fallado ($($check.ExitCode))" }
          Write-Output "Instalado en $dir y funcionando."
      - uses: actions/upload-artifact@v7
        with:
          name: boot-scout-windows
          path: dist/boot-scout-windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: PyInstaller
        run: |
          pip install . pyinstaller pillow
          pyinstaller --noconfirm packaging/boot-scout.spec
      - name: Probar la app
        run: |
          # Firma "ad hoc" (sin certificado): la pone PyInstaller y los Mac con chip de Apple
          # no abren nada sin ella. Si estuviera rota, macOS diría que la app está dañada.
          codesign --verify --deep --strict --verbose=2 dist/boot-scout.app
          dist/boot-scout.app/Contents/MacOS/boot-scout --comprobar
      - name: Imagen de disco
        run: |
          mkdir dmg
          cp -R dist/boot-scout.app dmg/
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname boot-scout -srcfolder dmg -ov -format UDZO dist/boot-scout-mac.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: boot-scout-mac
          path: dist/boot-scout-mac.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Paquete .deb
        run: packaging/linux/build-deb.sh
      - name: Instalarlo y probarlo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/boot-scout-linux.deb xvfb
          boot-scout --demo
          boot-scout --json - > /dev/null
          xvfb-run -a boot-scout-app --comprobar
      - uses: actions/upload-artifact@v7
        with:
          name: boot-scout-linux
          path: dist/boot-scout-linux.deb

  publicar:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' bootscout/__init__.py)"
            # Si esa versión ya estaba publicada, se sustituye (con su etiqueta) por la de este commit.
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "boot-scout $tag" --notes-file packaging/release-notes.md
